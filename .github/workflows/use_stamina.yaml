name: use_stamina (EnhancedUtils vs. BaseWWTask)
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      # format as "v3.3.80-rc.0" (worked for pyappify-action >=1.1.0)
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
jobs:
  use-stamina-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Check Files Existence
        run: |
          FILE1="src/task/BaseWWTask.py"
          FILE2="src/task/EnhancedUtils.py"
          #
          if [ ! -f "$FILE1" ] || [ ! -f "$FILE2" ]; then
            echo "Error: One or both files do not exist."
            exit 1
          fi
      - name: Extract Function "use_stamina"
        run: |
          TEMP_FILE1="/tmp/BaseWWTask.use_stamina.py"
          TEMP_FILE2="/tmp/EnhancedUtils.use_stamina.py"
          #
          python - <<'PY'
          import ast
          from pathlib import Path

          def remove_def_indent(segment):
              lines = segment.splitlines()
              def_line = lines[0]
              indent = def_line[:len(def_line) - len(def_line.lstrip(' \t'))]
              if not indent:
                  return segment.rstrip() + '\n'
              stripped_lines = []
              for line in lines:
                  if line.startswith(indent):
                      stripped_lines.append(line[len(indent):])
                  else:
                      stripped_lines.append(line)
              return '\n'.join(stripped_lines).rstrip() + '\n'

          def extract_function(file_path, node_path, output_file):
              source = Path(file_path).read_text(encoding='utf-8')
              tree = ast.parse(source, filename=file_path)
              node = tree
              for name in node_path:
                  candidates = getattr(node, 'body', [])
                  for child in candidates:
                      if isinstance(child, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)) and child.name == name:
                          node = child
                          break
                  else:
                      raise RuntimeError(f"Cannot find {' -> '.join(node_path)} in {file_path}")
              segment = ast.get_source_segment(source, node)
              if segment is None:
                  lines = source.splitlines()
                  segment = '\n'.join(lines[node.lineno - 1:node.end_lineno])
              text = remove_def_indent(segment)
              Path(output_file).write_text(text, encoding='utf-8')
              return text

          extract_function('src/task/BaseWWTask.py', ('BaseWWTask', 'use_stamina'), '/tmp/BaseWWTask.use_stamina.py')
          extract_function('src/task/EnhancedUtils.py', ('hijack_use_stamina', 'use_stamina'), '/tmp/EnhancedUtils.use_stamina.py')
          PY
          if cmp -s "$TEMP_FILE1" "$TEMP_FILE2"; then
            echo "Functions are identical. No diff needed."
            echo "FILES_IDENTICAL=true" >> $GITHUB_ENV
          else
            echo "Functions are different. Generating diff."
            echo "FILES_IDENTICAL=false" >> $GITHUB_ENV
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
      - name: Install Diff2html
        if: env.FILES_IDENTICAL == 'false'
        run: |
          sudo npm install -g diff2html-cli@5.2.15
      - name: Cache npm global packages
        if: env.FILES_IDENTICAL == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-global-diff2html-cli-5.2.15
      - name: Generate Diff HTML
        if: env.FILES_IDENTICAL == 'false'
        run: |
          TEMP_FILE1="/tmp/BaseWWTask.use_stamina.py"
          TEMP_FILE2="/tmp/EnhancedUtils.use_stamina.py"
          OUTPUT_FILE="readme/use_stamina.diff.html"
          #
          mkdir -p readme
          diff -u "$TEMP_FILE1" "$TEMP_FILE2" | diff2html --style side --input "stdin" --file "$OUTPUT_FILE"
          echo "Diff report has been generated at '$OUTPUT_FILE'."
          git add --renormalize "$OUTPUT_FILE"
          if ! git diff-index --quiet HEAD -- "$OUTPUT_FILE"; then
            git stash push -- "$OUTPUT_FILE"
            echo "DIFF_STASHED=true" >> $GITHUB_ENV
            echo "Changes of file '$OUTPUT_FILE' have been stashed."
          else
            echo "DIFF_STASHED=false" >> $GITHUB_ENV
            echo "No changes is found in file '$OUTPUT_FILE'."
          fi
      - name: Commit and Push
        if: env.FILES_IDENTICAL == 'false' && env.DIFF_STASHED == 'true'
        run: |
          sleep 60
          cd $GITHUB_WORKSPACE
          git fetch origin main
          git checkout main
          if ! git stash pop; then
            echo "git stash pop failed because of conflicts. Please resolve the generated diff update manually."
            git status --short
            exit 1
          fi
          if ! git diff-index --quiet HEAD -- readme/use_stamina.diff.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --renormalize readme/use_stamina.diff.html
            git commit -m "update file readme/use_stamina.diff.html" readme/use_stamina.diff.html
            PUSH_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            if ! PUSH_OUTPUT=$(git push "$PUSH_URL" main 2>&1); then
              echo "$PUSH_OUTPUT"
              echo "git push failed after updating main and reapplying generated changes."
              exit 1
            fi
            echo "Changes of file 'readme/use_stamina.diff.html' has been committed and pushed."
          else
            echo "No changes is found in file 'readme/use_stamina.diff.html'."
          fi
